<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        
    <defs>
        <linearGradient id="gradBlue" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F8CFF" />
            <stop offset="100%" stop-color="#00D4FF" />
        </linearGradient>
        <linearGradient id="gradCyan" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00D4FF" />
            <stop offset="100%" stop-color="#22C55E" />
        </linearGradient>
        <linearGradient id="gradMonochrome" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="gradDark" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#111827" />
            <stop offset="100%" stop-color="#374151" />
        </linearGradient>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&amp;display=swap');
            .text-fin { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 42px; }
            .text-twin { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 42px; }
            .text-ai { font-family: 'Outfit', sans-serif; font-weight: 300; font-size: 42px; }
            
            .text-fin-stack { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 48px; }
            .text-twin-stack { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 48px; }
            .text-ai-stack { font-family: 'Outfit', sans-serif; font-weight: 300; font-size: 48px; }
        </style>
    </defs>
    
        <circle cx="128" cy="128" r="128" fill="#0B1220" />
        
        <g transform="translate(58, 65) scale(1.4)">
            <!-- Left Twin (Digital) -->
            <rect x="20" y="20" width="40" height="40" rx="12" fill="url(#gradBlue)" opacity="0.85" transform="rotate(45, 40, 40)"/>
            <!-- Right Twin (Financial) -->
            <rect x="45" y="20" width="40" height="40" rx="12" fill="url(#gradCyan)" opacity="0.85" transform="rotate(45, 65, 40)"/>
            
            <!-- Upward Trend / Node Connection -->
            <path d="M 30 55 L 50 35 L 60 45 L 85 20" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="85" cy="20" r="4" fill="#F8FAFC"/>
            <circle cx="30" cy="55" r="4" fill="#F8FAFC"/>
        </g>
        
    </svg>